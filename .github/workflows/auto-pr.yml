name: Auto-open Pull Request

on:
  push:
    branches-ignore:
      - master

jobs:
  open-pr:
    name: Open PR for review
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.event.deleted == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open PR if one doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "$BRANCH" \
              --body "Pull request opened automatically from push to \`$BRANCH\`. Please review before merging to \`master\`."
          else
            echo "PR already open for $BRANCH, skipping."
          fi
